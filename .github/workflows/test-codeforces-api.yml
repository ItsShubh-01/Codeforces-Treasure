name: Sync Codeforces

on:
  workflow_dispatch:

  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Codeforces solutions
        env:
          CF_API_KEY: ${{ secrets.CODEFORCES_API_KEY }}
          CF_API_SECRET: ${{ secrets.CODEFORCES_API_SECRET }}
        run: |
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          import random
          import re
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          HANDLE = "RecursiveMoth"
          API_METHOD = "user.status"
          BATCH_SIZE = 1000

          # IMPORTANT:
          # This email must be associated with your GitHub account.
          GIT_NAME = "ItsShubh-01"
          GIT_EMAIL = "shubhagarwalaaaaa@gmail.com"

          def call_codeforces(params):
              params = dict(params)

              params["apiKey"] = os.environ["CF_API_KEY"]
              params["time"] = str(int(time.time()))

              params = dict(sorted(params.items()))

              query = urllib.parse.urlencode(params)

              rand = f"{random.randint(0, 999999):06d}"

              signature_string = (
                  rand
                  + "/"
                  + API_METHOD
                  + "?"
                  + query
                  + "#"
                  + os.environ["CF_API_SECRET"]
              )

              digest = hashlib.sha512(
                  signature_string.encode("utf-8")
              ).hexdigest()

              params["apiSig"] = rand + digest

              url = (
                  "https://codeforces.com/api/"
                  + API_METHOD
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              with urllib.request.urlopen(url, timeout=60) as response:
                  data = json.load(response)

              if data["status"] != "OK":
                  raise RuntimeError(
                      data.get(
                          "comment",
                          "Codeforces API request failed"
                      )
                  )

              return data["result"]

          def sanitize(text):
              text = text.lower()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              text = text.strip("-")

              if not text:
                  return "unknown-problem"

              return text

          def get_extension(language):
              language = language.lower()

              if "python" in language:
                  return ".py"

              if "java" in language:
                  return ".java"

              if "kotlin" in language:
                  return ".kt"

              if "rust" in language:
                  return ".rs"

              if "go" in language:
                  return ".go"

              if "javascript" in language:
                  return ".js"

              if "typescript" in language:
                  return ".ts"

              if "c#" in language or "csharp" in language:
                  return ".cs"

              if "php" in language:
                  return ".php"

              if "ruby" in language:
                  return ".rb"

              if "swift" in language:
                  return ".swift"

              if "scala" in language:
                  return ".scala"

              if "c++" in language or "gnu c++" in language:
                  return ".cpp"

              if language == "c" or language.startswith("c "):
                  return ".c"

              return ".txt"

          def run_git(command, env=None):
              subprocess.run(
                  command,
                  check=True,
                  env=env
              )

          print("======================================")
          print("Codeforces → GitHub Sync")
          print("======================================")
          print("Handle:", HANDLE)
          print()

          all_submissions = []
          start = 1

          while True:
              print(
                  f"Fetching submissions "
                  f"{start} to {start + BATCH_SIZE - 1}..."
              )

              submissions = call_codeforces({
                  "handle": HANDLE,
                  "from": str(start),
                  "count": str(BATCH_SIZE),
                  "includeSources": "true"
              })

              received = len(submissions)

              print("Received:", received)

              all_submissions.extend(submissions)

              if received < BATCH_SIZE:
                  break

              start += BATCH_SIZE

              # Codeforces API limit:
              # maximum one request every two seconds.
              time.sleep(2.2)

          print()
          print("Total submissions fetched:", len(all_submissions))

          accepted = [
              submission
              for submission in all_submissions
              if submission.get("verdict") == "OK"
          ]

          print("Accepted submissions:", len(accepted))

          # Keep only the latest accepted submission
          # for each unique Codeforces problem.
          latest_accepted = {}

          for submission in accepted:
              problem = submission.get("problem", {})

              contest_id = problem.get("contestId")
              index = problem.get("index")

              if contest_id is None or index is None:
                  continue

              problem_key = f"{contest_id}{index}"

              if problem_key not in latest_accepted:
                  latest_accepted[problem_key] = submission

          print(
              "Unique accepted problems:",
              len(latest_accepted)
          )

          # Sort chronologically so if several new problems
          # are detected in one run, their commits are created
          # from oldest submission to newest submission.
          submissions_to_process = sorted(
              latest_accepted.items(),
              key=lambda item: item[1].get(
                  "creationTimeSeconds",
                  0
              )
          )

          print()
          print("Processing solution files...")
          print()

          synced = 0
          skipped = 0
          commits_created = 0

          # Configure Git identity.
          run_git([
              "git",
              "config",
              "user.name",
              GIT_NAME
          ])

          run_git([
              "git",
              "config",
              "user.email",
              GIT_EMAIL
          ])

          for problem_key, submission in submissions_to_process:

              problem = submission.get("problem", {})

              contest_id = problem.get("contestId")
              index = problem.get("index")
              problem_name = problem.get(
                  "name",
                  "Unknown Problem"
              )

              language = submission.get(
                  "programmingLanguage",
                  "Unknown"
              )

              source_base64 = submission.get(
                  "sourceBase64"
              )

              creation_time = submission.get(
                  "creationTimeSeconds"
              )

              if not source_base64:
                  print(
                      f"SKIPPED: "
                      f"{contest_id}{index} - "
                      f"{problem_name} "
                      f"(no source code)"
                  )

                  skipped += 1
                  continue

              if not creation_time:
                  print(
                      f"SKIPPED: "
                      f"{contest_id}{index} - "
                      f"{problem_name} "
                      f"(no submission timestamp)"
                  )

                  skipped += 1
                  continue

              try:
                  source = base64.b64decode(
                      source_base64
                  ).decode("utf-8")

              except UnicodeDecodeError:
                  source = base64.b64decode(
                      source_base64
                  ).decode(
                      "utf-8",
                      errors="replace"
                  )

              folder_name = (
                  f"{contest_id}{index}-"
                  f"{sanitize(problem_name)}"
              )

              folder = Path(folder_name)

              folder.mkdir(
                  parents=True,
                  exist_ok=True
              )

              extension = get_extension(language)

              solution_file = (
                  folder / f"solution{extension}"
              )

              solution_file.write_text(
                  source,
                  encoding="utf-8"
              )

              print(
                  f"CHECKING: "
                  f"{contest_id}{index} - "
                  f"{problem_name} "
                  f"[{language}]"
              )

              # Stage only this problem's folder.
              run_git([
                  "git",
                  "add",
                  "--",
                  str(folder)
              ])

              # Check whether this particular problem
              # actually changed.
              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet",
                      "--",
                      str(folder)
                  ]
              )

              if result.returncode == 0:
                  print(
                      "  No change needed."
                  )
                  print()

                  synced += 1
                  continue

              # Convert Codeforces Unix timestamp to UTC.
              submission_datetime = datetime.fromtimestamp(
                  int(creation_time),
                  tz=timezone.utc
              )

              git_date = submission_datetime.strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              )

              env = os.environ.copy()

              # These dates are what GitHub uses for
              # contribution-date calculation.
              env["GIT_AUTHOR_DATE"] = git_date
              env["GIT_COMMITTER_DATE"] = git_date

              env["GIT_AUTHOR_NAME"] = GIT_NAME
              env["GIT_AUTHOR_EMAIL"] = GIT_EMAIL

              env["GIT_COMMITTER_NAME"] = GIT_NAME
              env["GIT_COMMITTER_EMAIL"] = GIT_EMAIL

              commit_message = (
                  f"Codeforces {contest_id}{index}: "
                  f"{problem_name}"
              )

              print(
                  f"  CHANGE DETECTED"
              )

              print(
                  f"  Codeforces submission time: "
                  f"{git_date}"
              )

              print(
                  f"  Creating commit: "
                  f"{commit_message}"
              )

              run_git(
                  [
                      "git",
                      "commit",
                      "-m",
                      commit_message
                  ],
                  env=env
              )

              commits_created += 1
              synced += 1

              print(
                  "  Commit created successfully."
              )
              print()

          print()
          print("======================================")
          print("Sync summary")
          print("======================================")
          print(
              "Total submissions:",
              len(all_submissions)
          )
          print(
              "Accepted submissions:",
              len(accepted)
          )
          print(
              "Unique accepted problems:",
              len(latest_accepted)
          )
          print(
              "Solutions processed:",
              synced
          )
          print(
              "Solutions skipped:",
              skipped
          )
          print(
              "Git commits created:",
              commits_created
          )
          print("======================================")

          if commits_created == 0:
              print()
              print("No new solution changes detected.")
              print("Nothing to push.")

          else:
              print()
              print(
                  f"Pushing {commits_created} "
                  f"historical-date commit(s) to GitHub..."
              )

              run_git([
                  "git",
                  "push",
                  "origin",
                  "main"
              ])

              print()
              print(
                  "Successfully pushed Codeforces solutions."
              )

          PY
